[package]
name = "kohdalab-iv-next"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kohdalab-iv-next"
path = "src/main.rs"

[[bin]]
name = "iv-cli"
path = "src/cli.rs"

[dependencies]
iv-core.workspace = true
iv-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }
egui_plot = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3", features = ["formatting"] }
toml = "0.9"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
