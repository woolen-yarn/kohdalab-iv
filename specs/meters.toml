[ADCMT_7461A]
display_name = "ADCMT 7461A"
roles = ["meter"]
measure_modes = ["dc_voltage", "dc_current"]
max_input_V = 1000.0
max_input_A = 3.0
auto_range_required = true
nplc_min = 0.02
nplc_max = 100.0
# No verified public programming-manual range command/range table has been
# incorporated. Fixed range selection must reject rather than fall back to Auto.
manual_range_status = "unsupported_pending_official_programming_manual"
resistance_reference = "https://www.adcmt.com/__/download/612c7d3fd5a43b06d08b2e3a/catalog-7461A-7461P-7451A-21.pdf"
resistance_reference_section = "Page 9, DC current, terminal resistance"

# DC current electrical loading. Terminal resistance includes the input path;
# shunt resistance alone does not include leads, contacts or fuse resistance.
current_input_resistances = [
    { range = 0.001, ohms = 103, kind = "terminal" },
    { range = 0.01, ohms = 10.5, kind = "terminal" },
    { range = 0.1, ohms = 1.5, kind = "terminal" },
    { range = 1, ohms = 0.5, kind = "terminal" },
    { range = 3, ohms = 0.5, kind = "terminal" },
]

