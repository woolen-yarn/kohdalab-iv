[AGILENT_34401A]
display_name = "Agilent 34401A"
roles = ["meter"]
measure_modes = ["dc_voltage", "dc_current"]
max_input_V = 1000.0
max_input_A = 3.0
auto_range_required = false
nplc_values = [0.02, 0.2, 1, 10, 100]
# Keysight 34401A User's Guide, Chapter 8 "DC Characteristics"; the service
# guide's DC-current table confirms the four current shunts/ranges.
manual_range_reference = "https://www.keysight.com/us/en/assets/9018-01063/user-manuals/9018-01063.pdf"
manual_range_reference_sections = ["Chapter 8, DC Characteristics: DC Voltage", "Chapter 8, DC Characteristics: DC Current"]
voltage_ranges = [0.1, 1.0, 10.0, 100.0, 1000.0]
current_ranges = [0.01, 0.1, 1.0, 3.0]

# DC current electrical loading. Terminal resistance includes the input path;
# shunt resistance alone does not include leads, contacts or fuse resistance.
current_input_resistances = [
    { range = 0.01, ohms = 5, kind = "shunt" },
    { range = 0.1, ohms = 5, kind = "shunt" },
    { range = 1, ohms = 0.1, kind = "shunt" },
    { range = 3, ohms = 0.1, kind = "shunt" },
]

