[workspace]
members = ["crates/iv-core", "crates/iv-transport", "crates/iv-desktop", "crates/instrument-protocol", "crates/instrument-hub", "crates/kohdalab-control-protocol"]
resolver = "3"

[workspace.package]
version = "1.3.0-alpha.19"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
iv-core = { path = "crates/iv-core" }
iv-transport = { path = "crates/iv-transport" }
instrument-protocol = { path = "crates/instrument-protocol" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
