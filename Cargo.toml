[workspace]
members = ["crates/iv-core", "crates/iv-transport", "crates/iv-desktop"]
resolver = "3"

[workspace.package]
version = "1.3.0-alpha.9"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iv-core = { path = "crates/iv-core" }
iv-transport = { path = "crates/iv-transport" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true
